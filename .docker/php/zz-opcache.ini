; Opcache tuning for a memory-constrained single-container deployment.
; Opcache reserves a shared memory block once (not per worker); the default is
; 128MB. 64MB is plenty for this codebase and is held for the life of the
; container, so halving it is a direct, permanent memory saving.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
; Code only changes on redeploy (which restarts the container and resets opcache),
; so we skip per-request timestamp stat() calls entirely.
opcache.validate_timestamps=0
; JIT stays off (default) - it would allocate an extra buffer we don't need.
opcache.jit=disable
opcache.jit_buffer_size=0
