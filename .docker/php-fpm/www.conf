[www]
; Don't set user/group - we're running as non-root (www-data already)
; user = www-data
; group = www-data

listen = 127.0.0.1:9000

; --- Memory-optimized process management ---
; ondemand: worker processes are spawned only when a request comes in and are
; killed after being idle for pm.process_idle_timeout. This releases RAM back to
; the host whenever the app is not actively serving traffic, which is most of the
; time for this workload. Railway bills memory as GB-hours, so idle workers sitting
; around under the old "dynamic" mode were the main avoidable cost.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Ensure environment variables are passed through
clear_env = no

; Catch worker output
catch_workers_output = yes
decorate_workers_output = no
